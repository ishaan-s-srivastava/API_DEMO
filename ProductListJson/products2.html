<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="jquery.min.js"></script>
    <title>products 2</title>
</head>
<body>

    <div id="result">
        <button>Display Product</button>
    </div>
    <script>
        document.getElementById("result").addEventListener("click", (event) => {
            $.get("products.json", function(products) {
                document.getElementById("result").innerHTML = 
                "<h1>" + products.Name + "</h1></br>" +
                "<p>" + products.Description + "</p></br>" +
                "<p>Price: " + products.Price + "</p></br>" +
                "<p>Categories: " + products.Categories + "</p>"
            })
        })
    </script>
    <style>
        h1 {
            font-family: Arial, Helvetica, sans-serif;
            margin-bottom: 10px;
        }

        h2 {
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
    </style>
    
</body>
</html>
